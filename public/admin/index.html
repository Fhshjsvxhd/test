<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/admin/i18n.js"></script>
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f1f3f8;
    --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --brand:#6366f1; --brand-2:#4f46e5;
    --good:#10b981; --bad:#ef4444; --warn:#f59e0b;
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  }
  [data-theme=dark]{
    --bg:#0a0f1c; --surface:#121829; --surface-2:#1a2238;
    --ink:#e5e9f0; --sub:#8a93a6; --line:#232b3f;
    --brand:#818cf8; --brand-2:#6366f1;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24;
    --shadow:0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  [x-cloak]{display:none!important}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .card-soft{background:var(--surface-2);border:1px solid var(--line);border-radius:10px}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;border:1px solid transparent;transition:all .12s;text-decoration:none}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-2)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--surface-2);color:var(--ink)}
  .btn-ghost:hover{background:var(--line)}
  .btn-outline{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn-outline:hover{background:var(--surface-2)}
  .btn-danger{background:rgba(239,68,68,.12);color:var(--bad)}
  .btn-danger:hover{background:rgba(239,68,68,.2)}
  .btn-icon{padding:7px;border-radius:7px}

  input[type=text],input[type=url],input[type=password],input[type=number],input[type=email],select,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 12px;font-size:14px;transition:all .12s;font-family:inherit
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  textarea{font-family:ui-monospace,Menlo,monospace;min-height:80px;resize:vertical}
  label{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:6px;display:block}
  .help{font-size:12px;color:var(--sub);margin-top:5px}

  /* switch */
  .switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  input:checked + .slider{background:var(--brand)}
  input:checked + .slider:before{transform:translateX(18px)}

  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:500;border:1px solid var(--line);cursor:pointer;transition:all .12s;user-select:none}
  .chip:hover:not(.active){background:var(--line)}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .badge-good{background:rgba(16,185,129,.15);color:var(--good)}
  .badge-bad{background:rgba(239,68,68,.15);color:var(--bad)}
  .badge-sub{background:var(--surface-2);color:var(--sub)}

  /* sidebar */
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;color:var(--sub);font-weight:500;font-size:14px;cursor:pointer;transition:all .1s}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:rgba(99,102,241,.12);color:var(--brand)}
  .nav-item svg{width:17px;height:17px;flex-shrink:0}

  /* tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--surface-2)}

  /* breadcrumb */
  .breadcrumb{display:flex;gap:8px;font-size:13px;color:var(--sub);margin-bottom:6px}
  .breadcrumb span::after{content:'/';margin-left:8px;opacity:.5}
  .breadcrumb span:last-child::after{content:''}
  .breadcrumb span:last-child{color:var(--ink)}

  /* radio-like button group */
  .btn-group{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
  .btn-group button{padding:6px 12px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--sub);border-radius:6px;cursor:pointer;transition:all .12s}
  .btn-group button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* kpi */
  .kpi-label{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
  .kpi-value{font-size:26px;font-weight:800;color:var(--ink);line-height:1;margin-top:6px}

  .scroll-thin::-webkit-scrollbar{width:8px;height:8px}
  .scroll-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  .modal-bg{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;font-size:14px;font-weight:500}

  .theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .theme-btn:hover{background:var(--line)}

  /* mono code box */
  .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;color:var(--brand);word-break:break-all}

  .copy-btn{cursor:pointer;color:var(--brand);font-size:12px;display:inline-flex;gap:4px;align-items:center;font-weight:500}
  .copy-btn:hover{color:var(--brand-2)}

  .link{color:var(--brand);text-decoration:none}
  .link:hover{text-decoration:underline}
</style>
</head>

<body x-data="app()" x-init="init()" class="min-h-screen">

<!-- LOGIN -->
<template x-if="!authed">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="card p-8 w-full max-w-md">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-[var(--brand)] flex items-center justify-center text-white font-bold">◆</div>
          <div class="font-bold text-lg" x-text="t('app.title')"></div>
        </div>
        <button class="theme-btn" @click="toggleTheme()">
          <svg x-show="theme==='dark'" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 2v2m0 16v2m10-10h-2M4 12H2m15.5-7.5l-1.4 1.4M7.9 16.1l-1.4 1.4m0-13l1.4 1.4m8.2 8.2l1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg x-show="theme==='light'" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
      <label x-text="t('login.token')"></label>
      <input type="password" x-model="tokenInput" @keydown.enter="login()" :placeholder="t('login.placeholder')">
      <button class="btn btn-primary w-full justify-center mt-4" @click="login()" x-text="t('login.signin')"></button>
      <div class="flex justify-center gap-2 mt-6 pt-5" style="border-top:1px solid var(--line)">
        <button class="chip" :class="lang==='en' && 'active'" @click="setLang('en')">EN</button>
        <button class="chip" :class="lang==='ru' && 'active'" @click="setLang('ru')">RU</button>
      </div>
    </div>
  </div>
</template>

<!-- APP -->
<div x-show="authed" x-cloak class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-60 border-r flex flex-col" style="background:var(--surface);border-color:var(--line)">
    <div class="p-4 border-b flex items-center gap-3" style="border-color:var(--line)">
      <div class="w-9 h-9 rounded-lg bg-[var(--brand)] flex items-center justify-center text-white font-bold">◆</div>
      <div class="font-bold" x-text="t('app.title')"></div>
    </div>
    <nav class="p-2 flex-1 space-y-0.5">
      <div class="nav-item" :class="tab==='campaigns'&&'active'" @click="goTab('campaigns')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span x-text="t('nav.campaigns')"></span>
      </div>
      <div class="nav-item" :class="tab==='stats'&&'active'" @click="goTab('stats')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span x-text="t('nav.stats')"></span>
      </div>
      <div class="nav-item" :class="tab==='conversions'&&'active'" @click="goTab('conversions')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span x-text="t('nav.conversions')"></span>
      </div>
      <div class="nav-item" :class="tab==='blacklist'&&'active'" @click="goTab('blacklist')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
        <span x-text="t('nav.blacklist')"></span>
      </div>
      <div class="nav-item" :class="tab==='help'&&'active'" @click="goTab('help')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span x-text="t('nav.help')"></span>
      </div>
    </nav>
    <div class="p-3 border-t space-y-2" style="border-color:var(--line)">
      <div class="flex gap-2">
        <button class="chip flex-1 justify-center" :class="lang==='en'&&'active'" @click="setLang('en')">EN</button>
        <button class="chip flex-1 justify-center" :class="lang==='ru'&&'active'" @click="setLang('ru')">RU</button>
        <button class="theme-btn" @click="toggleTheme()">
          <svg x-show="theme==='dark'" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 2v2m0 16v2m10-10h-2M4 12H2m15.5-7.5l-1.4 1.4M7.9 16.1l-1.4 1.4m0-13l1.4 1.4m8.2 8.2l1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg x-show="theme==='light'" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
      <button class="btn btn-ghost w-full justify-center text-sm" @click="logout()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span x-text="t('app.logout')"></span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 overflow-auto">

    <!-- CAMPAIGNS LIST -->
    <section x-show="tab==='campaigns' && view==='list'" class="p-7 max-w-6xl mx-auto">
      <div class="breadcrumb">
        <span x-text="t('app.home')"></span>
        <span x-text="t('nav.campaigns')"></span>
      </div>
      <div class="flex items-center justify-between mb-5">
        <h1 class="text-2xl font-bold" x-text="t('nav.campaigns')"></h1>
        <button class="btn btn-primary" @click="openEditor(null)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span x-text="t('campaigns.create')"></span>
        </button>
      </div>

      <div x-show="campaigns.length===0" class="card p-14 text-center">
        <div class="mx-auto mb-3 w-14 h-14 rounded-full flex items-center justify-center" style="background:var(--surface-2);color:var(--sub)">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div class="font-semibold mb-1" x-text="t('campaigns.empty_title')"></div>
        <div class="text-sm mb-5" style="color:var(--sub)" x-text="t('campaigns.empty_desc')"></div>
        <button class="btn btn-primary" @click="openEditor(null)" x-text="t('campaigns.create')"></button>
      </div>

      <div x-show="campaigns.length>0" class="card overflow-hidden">
        <table>
          <thead>
            <tr>
              <th x-text="t('table.name')"></th>
              <th x-text="t('table.tag')"></th>
              <th x-text="t('table.visits')"></th>
              <th x-text="t('table.passed')"></th>
              <th x-text="t('table.blocked')"></th>
              <th x-text="t('table.conversions')"></th>
              <th x-text="t('table.status')"></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="c in campaigns" :key="c.id">
              <tr>
                <td>
                  <div class="font-medium" x-text="c.name"></div>
                  <div class="text-xs" style="color:var(--sub)" x-text="c.slug"></div>
                </td>
                <td><span x-show="c.tag" class="badge badge-sub" x-text="c.tag"></span></td>
                <td x-text="c.total_visits||0"></td>
                <td><span class="font-medium" style="color:var(--good)" x-text="c.real_visits||0"></span></td>
                <td><span class="font-medium" style="color:var(--bad)" x-text="c.blocked_visits||0"></span></td>
                <td x-text="c.conv_count||0"></td>
                <td>
                  <label class="switch" @click.stop>
                    <input type="checkbox" :checked="c.status==='active'" @change="toggleStatus(c)">
                    <span class="slider"></span>
                  </label>
                </td>
                <td class="text-right whitespace-nowrap">
                  <button class="btn btn-ghost btn-icon mr-1" @click="openEditor(c)" :title="t('actions.edit')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </button>
                  <button class="btn btn-ghost btn-icon mr-1" @click="downloadPhp(c)" :title="t('actions.download')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                  </button>
                  <button class="btn btn-danger btn-icon" @click="deleteCampaign(c)" :title="t('actions.delete')">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/></svg>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- CAMPAIGN EDITOR (Palladium-style form) -->
    <section x-show="tab==='campaigns' && view==='edit'" class="p-7 max-w-4xl mx-auto">
      <div class="breadcrumb">
        <span class="cursor-pointer hover:text-[var(--brand)]" @click="view='list'" x-text="t('nav.campaigns')"></span>
        <span x-text="editor.id ? t('editor.edit') : t('editor.new')"></span>
      </div>

      <div class="flex items-center justify-between mb-5">
        <h1 class="text-2xl font-bold" x-text="t('editor.title')"></h1>
        <button class="btn btn-ghost" @click="view='list'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          <span x-text="t('actions.back')"></span>
        </button>
      </div>

      <div class="card p-6 space-y-5">
        <!-- Name -->
        <div>
          <label x-text="t('f.name')"></label>
          <input type="text" x-model="editor.name">
        </div>

        <!-- Geo -->
        <div>
          <label x-text="t('f.geo')"></label>
          <div class="btn-group mb-2">
            <button :class="editor.geo_mode==='allow'&&'active'" @click="editor.geo_mode='allow'" x-text="t('f.geo_allow')"></button>
            <button :class="editor.geo_mode==='block'&&'active'" @click="editor.geo_mode='block'" x-text="t('f.geo_block')"></button>
          </div>
          <input type="text" x-model="editor.geoSearch" :placeholder="t('f.geo_search')" class="mb-2">
          <div class="border rounded-lg p-2 max-h-40 overflow-auto scroll-thin flex flex-wrap gap-1.5" style="border-color:var(--line);background:var(--surface)">
            <template x-for="c in filteredCountries()" :key="c.code">
              <span class="chip" :class="editor.geoArr?.includes(c.code) && 'active'" @click="toggleArr(editor,'geoArr',c.code)">
                <span x-text="c.code"></span> <span class="opacity-70" x-text="c.name"></span>
              </span>
            </template>
          </div>
          <div class="help"><span x-text="editor.geoArr?.length||0"></span> <span x-text="t('f.geo_selected')"></span></div>
        </div>

        <!-- Language -->
        <div>
          <label x-text="t('f.lang')"></label>
          <select x-model="editor.language">
            <option value="" x-text="t('f.please_select')"></option>
            <template x-for="l in languages" :key="l.code">
              <option :value="l.code" x-text="l.code + ' — ' + l.name"></option>
            </template>
          </select>
        </div>

        <!-- Tag -->
        <div>
          <label x-text="t('f.tag')"></label>
          <input type="text" x-model="editor.tag" :placeholder="t('f.tag_placeholder')">
        </div>

        <!-- Integration mode -->
        <div>
          <label x-text="t('f.integration')"></label>
          <div class="btn-group">
            <button :class="editor.target_mode==='redirect'&&'active'" @click="editor.target_mode='redirect'" x-text="t('f.mode_redirect')"></button>
            <button :class="editor.target_mode==='frame'&&'active'" @click="editor.target_mode='frame'" x-text="t('f.mode_frame')"></button>
            <button :class="editor.target_mode==='include'&&'active'" @click="editor.target_mode='include'" x-text="t('f.mode_include')"></button>
          </div>
          <div class="help" x-text="t('f.integration_hint')"></div>
        </div>

        <!-- Target URL -->
        <div>
          <label x-text="t('f.target_url')"></label>
          <input type="text" x-model="editor.target_url" placeholder="https://offer.com/ or target-page.php">
          <div class="help" x-text="t('f.target_url_hint')"></div>
        </div>

        <!-- Bot URL -->
        <div>
          <label x-text="t('f.bot_url')"></label>
          <input type="text" x-model="editor.bot_url" placeholder="bot.html">
          <div class="help" x-text="t('f.bot_url_hint')"></div>

<!-- toast -->
<div x-show="toast" x-cloak class="toast" x-text="toast"></div>

<script>
function app() {
  return {
    authed: false, token: '', tokenInput: '',
    lang: 'en', theme: 'dark',
    tab: 'campaigns', view: 'list',
    rangeHours: 24,
    campaigns: [], overview: {}, reasons: [], timeline: [], visits: [],
    conversions: [], blacklist: [],
    visitsFilter: '',
    editor: {},
    bl: { kind: 'ip', value: '' },
    allCountries: [],
    languages: [
      { code: 'en', name: 'English' }, { code: 'ru', name: 'Русский' },
      { code: 'es', name: 'Español' },  { code: 'pt', name: 'Português' },
      { code: 'de', name: 'Deutsch' },  { code: 'fr', name: 'Français' },
      { code: 'it', name: 'Italiano' }, { code: 'pl', name: 'Polski' },
      { code: 'tr', name: 'Türkçe' },   { code: 'uk', name: 'Українська' },
      { code: 'ar', name: 'العربية' },  { code: 'zh', name: '中文' },
      { code: 'ja', name: '日本語' },
    ],
    toast: '', pollTimer: null,

    t(k) { return window.I18N[this.lang]?.[k] ?? window.I18N.en[k] ?? k; },
    origin() { return location.origin; },

    init() {
      this.lang = localStorage.getItem('cl_lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
      this.theme = localStorage.getItem('cl_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', this.theme);
      const t = localStorage.getItem('cl_token');
      if (t) { this.token = t; this.authed = true; this.boot(); }
    },
    setLang(l) { this.lang = l; localStorage.setItem('cl_lang', l); },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', this.theme);
      localStorage.setItem('cl_theme', this.theme);
      this.$nextTick(() => this.drawChart());
    },
    async boot() {
      const c = await this.api('/meta/countries');
      this.allCountries = c.rows || [];
      this.loadCampaigns();
      if (this.tab === 'stats') this.refresh();
      this.pollTimer = setInterval(() => {
        if (this.tab === 'stats') this.refresh();
        else if (this.tab === 'campaigns' && this.view === 'list') this.loadCampaigns();
      }, 10000);
    },
    login() {
      this.token = (this.tokenInput || '').trim();
      if (!this.token) return;
      this.authed = true;
      localStorage.setItem('cl_token', this.token);
      this.boot();
    },
    logout() {
      localStorage.removeItem('cl_token');
      this.authed = false; this.token = '';
      if (this.pollTimer) clearInterval(this.pollTimer);
    },
    async api(path, opts = {}) {
      const res = await fetch('/api' + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': this.token, ...(opts.headers||{}) }
      });
      if (res.status === 401) { this.logout(); return { ok: false }; }
      return res.json();
    },
    showToast(m) { this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 2200); },
    copy(s) { navigator.clipboard.writeText(s); this.showToast(this.t('toast.copied')); },

    goTab(t) {
      this.tab = t;
      this.view = 'list';
      if (t === 'stats') { this.refresh(); this.loadVisits(); }
      else if (t === 'conversions') this.loadConversions();
      else if (t === 'blacklist') this.loadBlacklist();
      else if (t === 'campaigns') this.loadCampaigns();
    },

    fmtDate(ts) {
      const d = new Date(ts), now = new Date();
      const same = d.toDateString() === now.toDateString();
      return same ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                  : d.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
    },
    humanReason(r) { if (!r) return '—'; const c = r.split(':')[0]; return this.t('reason.' + c) || c; },
    reasonPct(c) { const max = Math.max(1, ...this.reasons.map(r => r.count)); return Math.max(4, Math.round((c / max) * 100)); },
    toggleArr(obj, field, val) {
      if (!obj[field]) obj[field] = [];
      const i = obj[field].indexOf(val);
      if (i >= 0) obj[field].splice(i, 1); else obj[field].push(val);
    },
    filteredCountries() {
      const q = (this.editor.geoSearch || '').toLowerCase().trim();
      if (!q) return this.allCountries;
      return this.allCountries.filter(c => c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));
    },

    // ---- campaigns ----
    async loadCampaigns() {
      const r = await this.api('/campaigns');
      this.campaigns = r.rows || [];
    },
    openEditor(row) {
      const base = {
        id: null, name: '', tag: '', status: 'active',
        target_url: '', target_mode: 'redirect', bot_url: '',
        track_params: 1, disable_extra_bl: 0, allow_pr_chrome: 0,
        conversion_param: 'clickid',
        block_bots: 1, block_datacenter: 1, block_vpn_proxy: 1,
        block_headless: 1, block_empty_ua: 1, block_no_lang: 1,
        require_referrer: 0,
        geo: '[]', geo_mode: 'allow', geoArr: [], geoSearch: '',
        language: '',
        slug: '', api_key: '',
      };
      if (row) {
        const merged = { ...base, ...row };
        try { merged.geoArr = JSON.parse(row.geo || '[]') || []; } catch { merged.geoArr = []; }
        this.editor = merged;
      } else {
        this.editor = base;
      }
      this.view = 'edit';
    },
    async saveCampaign() {
      const d = this.editor;
      const body = {
        name: d.name, tag: d.tag, status: d.status || 'active',
        target_url: d.target_url, target_mode: d.target_mode, bot_url: d.bot_url,
        track_params: d.track_params, disable_extra_bl: d.disable_extra_bl, allow_pr_chrome: d.allow_pr_chrome,
        conversion_param: d.conversion_param,
        block_bots: d.block_bots, block_datacenter: d.block_datacenter, block_vpn_proxy: d.block_vpn_proxy,
        block_headless: d.block_headless, block_empty_ua: d.block_empty_ua, block_no_lang: d.block_no_lang,
        require_referrer: d.require_referrer,
        geo: JSON.stringify(d.geoArr || []),
        geo_mode: d.geo_mode, language: d.language,
      };
      const r = d.id
        ? await this.api('/campaigns/' + d.id, { method: 'PUT', body: JSON.stringify(body) })
        : await this.api('/campaigns', { method: 'POST', body: JSON.stringify(body) });
      if (r.ok) {
        this.showToast(this.t('toast.saved'));
        await this.loadCampaigns();
        // if newly created, move back to list; if editing, stay but refresh state with fresh id
        if (!d.id && r.id) {
          const fresh = this.campaigns.find(x => x.id === r.id);
          if (fresh) this.openEditor(fresh);
        }
      } else { this.showToast(r.error || 'Error'); }
    },
    async toggleStatus(c) {
      const next = c.status === 'active' ? 'paused' : 'active';
      await this.api('/campaigns/' + c.id, { method: 'PUT', body: JSON.stringify({ status: next }) });
      c.status = next;
    },
    async deleteCampaign(c) {
      if (!confirm(this.t('confirm.delete_campaign'))) return;
      await this.api('/campaigns/' + c.id, { method: 'DELETE' });
      this.loadCampaigns();
    },
    downloadPhp(c) {
      const url = '/api/campaigns/' + c.id + '/download.php?token=' + encodeURIComponent(this.token);
      const a = document.createElement('a');
      a.href = url; a.download = 'cloak.php';
      document.body.appendChild(a); a.click(); a.remove();
    },
    postbackUrl() {
      return this.origin() + '/v1/postback?clickid={clickid}&payout={payout}&status=approved';
    },

    // ---- stats ----
    async refresh() {
      if (!this.authed) return;
      const since = Date.now() - this.rangeHours * 3600 * 1000;
      const [o, r, tl] = await Promise.all([
        this.api('/stats/overview?since=' + since),
        this.api('/stats/reasons?since=' + since),
        this.api('/stats/timeline?hours=' + this.rangeHours),
      ]);
      this.overview = o || {};
      this.reasons = r.rows || [];
      this.timeline = tl.rows || [];
      this.$nextTick(() => this.drawChart());
      this.loadVisits();
    },
    async loadVisits() {
      const q = this.visitsFilter ? '?decision=' + this.visitsFilter : '';
      const r = await this.api('/visits' + q);
      this.visits = r.rows || [];
    },
    drawChart() {
      const el = this.$refs.chart;
      if (!el) return;
      const w = el.clientWidth || 600, h = el.clientHeight || 180;
      if (!this.timeline.length) { el.innerHTML = `<div class="text-sm flex items-center justify-center h-full" style="color:var(--sub)">${this.t('empty.no_traffic')}</div>`; return; }
      const data = this.timeline;
      const max = Math.max(1, ...data.map(d => (d.real || 0) + (d.blocked || 0)));
      const pad = 24;
      const bw = (w - pad * 2) / data.length;
      const s = getComputedStyle(document.documentElement);
      const good = s.getPropertyValue('--good').trim() || '#10b981';
      const bad = s.getPropertyValue('--bad').trim() || '#ef4444';
      const sub = s.getPropertyValue('--sub').trim() || '#8a93a6';
      let svg = '';
      data.forEach((d, i) => {
        const real = d.real || 0, blocked = d.blocked || 0;
        const x = pad + i * bw + 2;
        const realH = (real / max) * (h - pad * 2);
        const blockedH = (blocked / max) * (h - pad * 2);
        if (blockedH > 0) svg += `<rect x="${x}" y="${h - pad - blockedH}" width="${bw - 4}" height="${blockedH}" fill="${bad}" opacity=".9" rx="2"/>`;
        if (realH > 0)    svg += `<rect x="${x}" y="${h - pad - blockedH - realH}" width="${bw - 4}" height="${realH}" fill="${good}" opacity=".9" rx="2"/>`;
      });
      const step = Math.max(1, Math.ceil(data.length / 8));
      data.forEach((d, i) => {
        if (i % step !== 0) return;
        const x = pad + i * bw + bw / 2;
        const dt = new Date(d.t);
        const bm = data.length > 1 ? data[1].t - data[0].t : 3600000;
        const label = bm >= 24 * 3600000 ? `${dt.getDate()}/${dt.getMonth() + 1}` : `${String(dt.getHours()).padStart(2,'0')}:00`;
        svg += `<text x="${x}" y="${h - 6}" fill="${sub}" font-size="10" text-anchor="middle">${label}</text>`;
      });
      el.innerHTML = `<svg width="${w}" height="${h}" style="width:100%;display:block">${svg}</svg>`;
    },

    // ---- conversions ----
    async loadConversions() {
      const r = await this.api('/conversions');
      this.conversions = r.rows || [];
    },

    // ---- blacklist ----
    async loadBlacklist() {
      const r = await this.api('/blacklist');
      this.blacklist = r.rows || [];
    },
    async addBl() {
      if (!this.bl.value) return;
      await this.api('/blacklist', { method: 'POST', body: JSON.stringify(this.bl) });
      this.bl.value = '';
      this.loadBlacklist();
      this.showToast(this.t('toast.added'));
    },
    async removeBl(id) {
      await this.api('/blacklist/' + id, { method: 'DELETE' });
      this.loadBlacklist();
    },
  };
}
</script>
